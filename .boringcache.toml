workspace = "boringcache/waterui"

[entries.test-target]
kind = "cargo-target"
tag = "test-target"
path = "target"

[entries.cargo-registry-cache]
tag = "cargo-registry-cache"

[entries.cargo-registry-index]
tag = "cargo-registry-index"

[entries.cargo-git-db]
tag = "cargo-git-db"

[profiles.test]
entries = ["test-target", "cargo-registry-cache", "cargo-registry-index", "cargo-git-db"]

[adapters.sccache]
tag = "rust"

[adapters.cargo]
profiles = ["test"]
compiler-cache = "sccache"
fail-on-cache-error = true
